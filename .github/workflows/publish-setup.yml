name: Publish validated Setup 0.11.1
run-name: Publish validated MultiDesk Setup 0.11.1
on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: Temporary read-only URL for validated distribution artifact
        required: true
        type: string
  repository_dispatch:
    types: [publish-setup-0-11-1]
permissions:
  contents: write
concurrency:
  group: multidesk-setup-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact distribution bytes and publish Setup
        env:
          DISTRIBUTION_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PYTHON'
          """One-time publication of the exact, privately validated MultiDesk 0.11.1 artifact.
          No application code, personal access token, or persistent private-repository access
          is needed by this public workflow. The input URL only reads the distribution ZIP.
          """
          import base64
          import hashlib
          import io
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          REPOSITORY = "LucasLPDev/MultiDesk-LLP-Downloads"
          TAG = "v0.11.1"
          PREVIOUS_TAG = "v0.11.0"
          SOURCE_REPOSITORY_ID = "1436089111"
          SOURCE_RUN = 42260876029
          RELEASE_NAME = "MultiDesk-LLP 0.11.1 — menos GPU e CPU com o PokéIdle"
          RELEASE_BODY = "## Novidades da 0.11.1\n\nCorreção de consumo de GPU/CPU com o PokéIdle (COR-19). Conexão, temporizadores, captura, /hunt, Rotom e o lançador continuam como antes.\n\n- **Contas fora da tela não desenham a animação:** bandeja, janela minimizada, contas ocultas no Foco e painéis sobre as contas.\n- **Até 30 quadros por segundo** com a conta visível e **até 10** com outra janela em foco, como um jogo.\n- **Zoom abaixo de 100%:** a animação usa a resolução de 100%, em vez de até quatro vezes mais pixels.\n- O leitor de níveis observa somente nome, nível e equipe.\n\nTudo ajustável em **Configurações → Desempenho da cena do PokéIdle**; desligar as opções devolve o comportamento da 0.11.0.\n\n## Atualização pelo aplicativo\n\nConfigurações → Atualizações → Verificar versão → Atualizar agora → Reiniciar e concluir.\n\nO Setup atualiza na mesma pasta e preserva os dados do MultiDesk. Para uma instalação nova, use MultiDesk-LLP-Setup-0.11.1.exe abaixo.\n\nInstalador Windows x64, validado na atualização da 0.11.0 para a 0.11.1. Lançador e sons preservados.\n"
          ARCHIVE_SHA256 = 'f5274eb2bdb099ab448ef2db21f8fb4adc47b17ef4b5a659b8cc239f103a96a8'
          ARCHIVE_SIZE = 121248012
          INSTALLER = "MultiDesk-LLP-Setup-0.11.1.exe"
          INSTALLER_SIZE = 121108097
          INSTALLER_SHA512 = 'BQZ/4j3wpszjlwkScO45hFJEfDR9mMCp46wbUonWrcfGrtD1+/fNSEzb/1scnjlWeDkvQxExbwTJrVPuy3XEkg=='
          EXPECTED = {'latest.yml': '3aebf5fbfb5406043fbe0033f850bad2c8e3a6f2b16136aed01a3f335aa08a2d', 'MultiDesk-LLP-Setup-0.11.1.exe': '1188848c158f8afa10631dcd226694e960bd8a6897a23482610f932330f19944', 'MultiDesk-LLP-Setup-0.11.1.exe.blockmap': '5334a03c4778762efd4641d1983f0fdea4fe21cdd911e1327c596f659052365f', 'SHA256SUMS.txt': '500de56ff50510cce1aa8434fd7df008630d20316f65c56d682d5fd36096eaa3'}
          ARCHIVE_ENTRIES = {'release/latest.yml': '3aebf5fbfb5406043fbe0033f850bad2c8e3a6f2b16136aed01a3f335aa08a2d', 'release/MultiDesk-LLP-Setup-0.11.1.exe': '1188848c158f8afa10631dcd226694e960bd8a6897a23482610f932330f19944', 'release/MultiDesk-LLP-Setup-0.11.1.exe.blockmap': '5334a03c4778762efd4641d1983f0fdea4fe21cdd911e1327c596f659052365f', 'release/SHA256SUMS.txt': '500de56ff50510cce1aa8434fd7df008630d20316f65c56d682d5fd36096eaa3'}
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          OPENER = urllib.request.build_opener(NoRedirect)
          
          def ensure(condition, message):
              if not condition:
                  raise RuntimeError(message)
          
          def sha256(data):
              return hashlib.sha256(data).hexdigest()
          
          def checked_payload(archive):
              ensure(len(archive) == ARCHIVE_SIZE, "Distribution archive size differs from validated CI")
              ensure(sha256(archive) == ARCHIVE_SHA256, "Distribution archive SHA-256 differs from validated CI")
              with zipfile.ZipFile(io.BytesIO(archive)) as package:
                  entries = package.infolist()
                  ensure(len(entries) == len(ARCHIVE_ENTRIES), "Distribution archive entry count differs from validated CI")
                  ensure(sorted(entry.filename for entry in entries) == sorted(ARCHIVE_ENTRIES), "Unexpected archive entry")
                  for entry in entries:
                      ensure(not entry.is_dir(), "Directories are not accepted")
                      ensure(entry.create_system != 3 or (entry.external_attr >> 16) & 0o170000 != 0o120000, "Links are not accepted")
                      ensure(not (entry.flag_bits & 1), "Encrypted entries are not accepted")
                      ensure(0 < entry.file_size <= 128 * 1024 * 1024, "Invalid distribution asset size")
                  payload = {entry.filename: package.read(entry) for entry in entries}
              for name, digest in ARCHIVE_ENTRIES.items():
                  ensure(sha256(payload[name]) == digest, "Archive payload differs from validated CI: " + name)
              # Only the installer, blockmap, feed and checksums are released. Themes are
              # published separately under themes/v2; never as app release assets.
              assets = {name: payload["release/" + name] for name in EXPECTED}
              for name, digest in EXPECTED.items():
                  ensure(sha256(assets[name]) == digest, "Asset SHA-256 differs from validated CI: " + name)
              ensure(assets[INSTALLER][:2] == b"MZ", "Installer is not a Windows executable")
              ensure(len(assets[INSTALLER]) == INSTALLER_SIZE, "Installer size differs from validated CI")
              ensure(base64.b64encode(hashlib.sha512(assets[INSTALLER]).digest()).decode() == INSTALLER_SHA512, "Installer SHA-512 differs from validated CI")
              feed = assets["latest.yml"].decode("utf-8")
              ensure("version: 0.11.1\n" in feed, "Feed version mismatch")
              ensure("path: " + INSTALLER + "\n" in feed, "Feed installer path mismatch")
              ensure("  - url: " + INSTALLER + "\n" in feed, "Feed installer URL mismatch")
              ensure("    size: " + str(INSTALLER_SIZE) + "\n" in feed, "Feed installer size mismatch")
              ensure(feed.count("sha512: " + INSTALLER_SHA512) == 2, "Feed installer SHA-512 mismatch")
              manifest = {}
              for line in assets["SHA256SUMS.txt"].decode("utf-8-sig").splitlines():
                  match = re.fullmatch(r"([a-f0-9]{64})  ([^/\\]+)", line)
                  ensure(match and match[2] not in manifest, "Malformed checksum manifest")
                  manifest[match[2]] = match[1]
              ensure(manifest == {name: digest for name, digest in EXPECTED.items() if name != "SHA256SUMS.txt"}, "Checksum manifest mismatch")
              return assets
          
          def api(path, token, method="GET", data=None):
              url = "https://api.github.com/repos/" + REPOSITORY + path
              headers = {
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "MultiDesk-Distribution-Workflow",
              }
              if data is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(data).encode()
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with OPENER.open(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise RuntimeError("GitHub API operation returned HTTP " + str(error.code)) from None
          
          def verified_remote_assets(token, release_id, assets, complete):
              remote = api("/releases/" + str(release_id) + "/assets?per_page=100", token)
              ensure(isinstance(remote, list), "Invalid remote asset listing")
              ensure(len(remote) <= 4, "Release contains unexpected assets")
              names = [item.get("name") for item in remote]
              ensure(len(set(names)) == len(names), "Duplicate remote assets")
              ensure(set(names).issubset(EXPECTED), "Unexpected remote asset")
              if complete:
                  ensure(set(names) == set(EXPECTED), "Release is missing distribution assets")
              for item in remote:
                  name = item["name"]
                  ensure(item.get("state") == "uploaded", "Incomplete remote asset: " + name)
                  ensure(item.get("size") == len(assets[name]), "Remote size mismatch: " + name)
                  ensure(item.get("digest") == "sha256:" + EXPECTED[name], "Remote SHA-256 missing or mismatched: " + name)
              return set(names)
          
          def upload(release_id, name, content, token):
              # Fixed host and release ID: the token is never sent to the artifact URL.
              url = "https://uploads.github.com/repos/" + REPOSITORY + "/releases/" + str(release_id) + "/assets?name=" + urllib.parse.quote(name, safe="")
              request = urllib.request.Request(url, data=content, method="POST", headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/octet-stream",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "MultiDesk-Distribution-Workflow",
              })
              try:
                  with OPENER.open(request, timeout=240) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as error:
                  raise RuntimeError("Asset upload returned HTTP " + str(error.code)) from None
              ensure(result.get("name") == name and result.get("digest") == "sha256:" + EXPECTED[name], "Uploaded asset verification failed: " + name)
              print("Uploaded and verified: " + name)
          
          def main():
              ensure(os.environ.get("GITHUB_REPOSITORY") == REPOSITORY, "Wrong workflow repository")
              ensure(os.environ.get("GITHUB_EVENT_NAME") in ("workflow_dispatch", "repository_dispatch"), "Explicit publication dispatch required")
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
                  event = json.load(stream)
              payload = event.get("inputs", {}) if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" else event.get("client_payload", {})
              if os.environ["GITHUB_EVENT_NAME"] == "repository_dispatch":
                  ensure(event.get("action") == "publish-setup-0-11-1", "Unexpected repository dispatch type")
              signed_url = payload.get("artifact_url", "")
              ensure(isinstance(signed_url, str) and 0 < len(signed_url) < 8192, "Artifact URL is missing or invalid")
              # Read from the event file; never interpolate an input into a shell or env.
              masked = signed_url.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::add-mask::" + masked, flush=True)
              parsed = urllib.parse.urlparse(signed_url)
              ensure(parsed.scheme == "https" and parsed.hostname in ("release-assets.githubusercontent.com", "objects.githubusercontent.com"), "Artifact URL host is not a reviewed GitHub release asset host")
              ensure(parsed.username is None and parsed.password is None and parsed.port in (None, 443) and not parsed.fragment, "Invalid artifact URL authority")
              # Release assets of the private source repository only; the bytes are pinned below.
              ensure(re.fullmatch(r"/github-production-release-asset(?:-2e65be)?/" + SOURCE_REPOSITORY_ID + r"/[0-9a-f-]{36}", parsed.path) is not None, "Artifact URL is not a release asset of the source repository")
              query = urllib.parse.parse_qs(parsed.query)
              ensure(query.get("sp") == ["r"] if parsed.hostname == "release-assets.githubusercontent.com" else bool(query.get("X-Amz-Signature")), "Artifact URL must be a signed read-only URL")
              token = os.environ.get("DISTRIBUTION_TOKEN", "")
              ensure(bool(token), "Workflow repository token is missing")
              request = urllib.request.Request(signed_url, headers={"User-Agent": "MultiDesk-Distribution-Workflow"})
              try:
                  with OPENER.open(request, timeout=180) as response:
                      archive = response.read(ARCHIVE_SIZE + 1)
              except Exception:
                  raise RuntimeError("Distribution archive could not be downloaded; the temporary URL may have expired") from None
              assets = checked_payload(archive)
              print("Validated the exact four distribution assets from private CI run " + str(SOURCE_RUN) + ": Windows, Node tests, scene drawing budget, simplified scene, controls, workspaces, HUD, Ultra, plugins, packaged modules and NSIS upgrade from 0.11.0 passed")
              destination = api("", token)
              ensure(destination.get("full_name") == REPOSITORY and destination.get("private") is False, "Distribution repository must be public")
              latest = api("/releases/latest", token)
              ensure(latest.get("tag_name") in (PREVIOUS_TAG, TAG), "A different version is now latest; review before publication")
              releases = api("/releases?per_page=100", token)
              ensure(isinstance(releases, list), "Invalid release listing")
              matching = [item for item in releases if item.get("tag_name") == TAG]
              ensure(len(matching) <= 1, "More than one release uses the tag")
              if matching:
                  release = matching[0]
              else:
                  release = api("/releases", token, "POST", {"tag_name": TAG, "target_commitish": "main", "name": RELEASE_NAME, "body": RELEASE_BODY, "draft": True, "prerelease": False})
                  print("Created draft release " + TAG)
              release_id = release.get("id")
              ensure(isinstance(release_id, int) and release.get("tag_name") == TAG and release.get("prerelease") is False, "Unexpected release destination")
              existing = verified_remote_assets(token, release_id, assets, complete=not release.get("draft"))
              if not release.get("draft"):
                  print("The exact validated release is already public")
                  return
              for name in EXPECTED:
                  if name not in existing:
                      upload(release_id, name, assets[name], token)
              verified_remote_assets(token, release_id, assets, complete=True)
              release = api("/releases/" + str(release_id), token, "PATCH", {"tag_name": TAG, "target_commitish": release["target_commitish"], "name": RELEASE_NAME, "body": RELEASE_BODY, "draft": False, "prerelease": False, "make_latest": "true"})
              ensure(release.get("draft") is False and release.get("prerelease") is False, "Release publication did not complete")
              verified_remote_assets(token, release_id, assets, complete=True)
              print("Published: https://github.com/" + REPOSITORY + "/releases/tag/" + TAG)
          
          if __name__ == "__main__":
              try:
                  main()
              except Exception as error:
                  # No traceback, signed URL, or token is included in failure output.
                  print("Publication failed: " + str(error), file=sys.stderr)
                  sys.exit(1)
          PYTHON
